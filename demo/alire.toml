name = "demo"
description = "Executable for DSA from scratch"
version = "0.1.0-dev"

authors = ["Max Reznik"]
maintainers = ["Max Reznik <reznikmm@gmail.com>"]
maintainers-logins = ["reznikmm"]
licenses = "GPL-3.0-or-later WITH GCC-exception-3.1"
website = ""
tags = []

project-files = ["client.gpr"]

executables = ["client"]

[build-switches]
development.optimization = ["-O0"]
development.style_checks = ["-gnaty", "-gnaty-B"]
development.contracts = "Yes"
"*".debug_info = "Yes"

[build-profiles]
"*" = "development"

[[depends-on]]
dsa_fs = "*"

[[pins]]
dsa_fs = { path='..' }
